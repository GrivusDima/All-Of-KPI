services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      - 1500:1500
    environment:
      EULA: "true"
      TYPE: NEOFORGE
      VERSION: 1.21.1
      MOTD: Osiris is still a furry and is hiding it
      ONLINE_MODE: "FALSE"
      SERVER_PORT: 1500
      ENABLE_RCON: "FALSE"
      RCON_PORT: 6969
      RCON_PASSWORD: peepeepoopoo_changeme
      DIFFICULTY: hard
      MAX_PLAYERS: 10
      ALLOW_FLIGHT: "true"
      ENABLE_COMMAND_BLOCK: "true"
      SPAWN_PROTECTION: 0
      VIEW_DISTANCE: 8
      SIMULATION_DISTANCE: 8
      MEMORY: 12G
      JVM_XX_OPTS: "-XX:+UseZGC -XX:+ZGenerational -XX:+AlwaysPreTouch -XX:+UseStringDeduplication"
    volumes:
      - ./data:/data
    restart: unless-stopped
networks: {}
